<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed | Crave Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #FF4757;
        --success: #10b981;
        --bg-color: #f8f9fa;
        --surface: #ffffff;
        --text-main: #2b2b2b;
        --text-muted: #8e8e8e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Outfit', sans-serif;
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover fixed;
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding-top: 100px;
        overflow: hidden;
    }

    .navbar {
        position: fixed; top: 0; left: 0; width: 100%; height: 75px;
        padding: 0 5%; display: flex; justify-content: space-between; align-items: center;
        background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); z-index: 1000;
    }
    .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-links { list-style: none; display: flex; gap: 2rem; }
    .nav-links li a { text-decoration: none; color: var(--text-main); font-weight: 500; transition: color 0.3s; }
    .nav-links li a:hover { color: var(--primary); }

    .success-container {
        width: 100%;
        max-width: 450px;
        background: var(--surface);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.04);
        padding: 50px 40px;
        text-align: center;
        border: 1px solid rgba(0,0,0,0.02);
        z-index: 10;
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .icon-wrapper {
        width: 90px;
        height: 90px;
        background: rgba(16, 185, 129, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px auto;
        color: var(--success);
        position: relative;
    }

    .icon-wrapper svg {
        animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both;
    }

    @keyframes pop {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }

    h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
    }

    p {
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.5;
        margin-bottom: 35px;
    }

    .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 16px;
        background: var(--primary);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
        text-decoration: none;
        box-shadow: 0 8px 20px rgba(255, 71, 87, 0.25);
    }

    .btn-home:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
    }

    /* Confetti generated by script */
    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--primary);
        animation: fall 3s linear forwards;
    }

    @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 600px) {
        .success-container { border-radius: 0; box-shadow: none; padding: 40px 20px; margin-top: -20px;}
        .nav-links { display: none; }
    }
</style>
</head>
<body>

<nav class="navbar">
    <a href="welcome.html#home" class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        Crave Cart
    </a>
    <ul class="nav-links">
        <li><a href="welcome.html#home">Home</a></li>
        <li><a href="welcome.html#about">About</a></li>
        <li><a href="welcome.html#crave-list">Crave List</a></li>
        <li><a href="welcome.html#contact">Contact</a></li>
    </ul>
</nav>

<div class="success-container">
    <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    
    <h1>Order Placed!</h1>
    <p>Your payment was successful and your delicious food is now being prepared. We'll deliver it hot & fresh very soon!</p>
    
    <a href="variety.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Menu
    </a>
</div>

<script>
    // Confetti generator
    const colors = ['#FF4757', '#10b981', '#f59e0b', '#3b82f6', '#8b5cf6'];
    for(let i=0; i<60; i++) {
        let conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.background = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
        conf.style.animationDelay = (Math.random() * 2) + 's';
        document.body.appendChild(conf);
    }
</script>
</body>
</html>
