<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Crave Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF4757;
            --primary-hover: #ff2e43;
            --bg-color: #f8f9fa;
            --surface: #ffffff;
            --text-main: #2b2b2b;
            --text-muted: #8e8e8e;
            --border: #ebebeb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 100px;
        }

        /* Navbar exact match with Crave Cart */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.3s;
            font-size: 1rem;
        }

        .nav-links li a:hover {
            color: var(--primary);
        }

        /* Payment Container */
        .checkout-container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .checkout-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .checkout-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Payment Options */
        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 35px;
        }

        .payment-option {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--surface);
        }

        .payment-option:hover {
            border-color: #ffd6da;
            background: #fffafa;
        }

        /* Hide actual radio */
        .payment-option input[type="radio"] {
            display: none;
        }

        /* Selected state styling */
        .payment-option input[type="radio"]:checked+.option-content {
            opacity: 1;
        }

        .payment-option.selected {
            border-color: var(--primary);
            background: #fffafa;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.08);
        }

        /* Custom Radio styling */
        .custom-radio {
            width: 22px;
            height: 22px;
            border: 2px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .payment-option.selected .custom-radio {
            border-color: var(--primary);
        }

        .payment-option.selected .custom-radio::after {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .option-content {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .provider-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .provider-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* Pay Button */
        .btn-pay {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: var(--primary);
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-pay:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.35);
        }

        .btn-pay:active {
            transform: translateY(0);
        }

        .secure-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .checkout-container {
                border-radius: 0;
                box-shadow: none;
                padding: 25px 20px;
                margin-top: -20px;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="welcome.html#home" class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            Crave Cart
        </a>
        <ul class="nav-links">
            <li><a href="welcome.html#home">Home</a></li>
            <li><a href="welcome.html#about">About</a></li>
            <li><a href="welcome.html#crave-list">Crave List</a></li>
            <li><a href="welcome.html#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Payment Method</h1>
            <p>Choose your preferred way to pay</p>
        </div>

        <div class="payment-methods">
            <!-- Paytm -->
            <label class="payment-option selected" onclick="selectOption(this)">
                <div class="option-content">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/Paytm_logo.png"
                        alt="Paytm" style="height: 28px; object-fit: contain;">
                </div>
                <div class="custom-radio"></div>
                <input type="radio" name="payment" value="paytm" checked>
            </label>

            <!-- PhonePe -->
            <label class="payment-option" onclick="selectOption(this)">
                <div class="option-content">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" alt="PhonePe"
                        style="height: 30px; object-fit: contain;">
                </div>
                <div class="custom-radio"></div>
                <input type="radio" name="payment" value="phonepe">
            </label>

            <!-- GPay -->
            <label class="payment-option" onclick="selectOption(this)">
                <div class="option-content">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg" alt="Google Pay"
                        style="height: 28px; object-fit: contain;">
                </div>
                <div class="custom-radio"></div>
                <input type="radio" name="payment" value="gpay">
            </label>
        </div>

        <button class="btn-pay" onclick="window.location.href='qr.html'">
            Proceed to Pay
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>

        <div class="secure-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Payments are secure and encrypted
        </div>
    </div>

    <script>
        function selectOption(clickedElement) {
            // Remove selected class from all
            document.querySelectorAll('.payment-option').forEach(el => {
                el.classList.remove('selected');
            });
            // Add selected class to clicked
            clickedElement.classList.add('selected');
        }
    </script>

</body>

</html>
